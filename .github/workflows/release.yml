name: Release kernels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; leave empty to test the selected ref without publishing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 .github/scripts/release.py prepare

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools vim
      - name: Install macOS Vim
        if: runner.os == 'macOS'
        run: brew install vim
      - name: Install Windows Vim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vim --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed with exit code $LASTEXITCODE" }
          $installDir = Get-Content -LiteralPath "$env:ChocolateyInstall/lib/vim/tools/installDir"
          $vim = Get-ChildItem -LiteralPath "$installDir/vim" -Filter vim.exe -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$vim) { throw 'Vim was not installed' }
          "TEXINSITU_VIM=$vim" >> $env:GITHUB_ENV
          "RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
      - name: Select Rust stable and target
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Test installer without network
        run: python tests/installer.py
      - name: Test and build the native kernel
        run: |
          cargo test --release --locked --manifest-path kernel/Cargo.toml --target "$TARGET"
          cargo build --release --locked --manifest-path kernel/Cargo.toml --target "$TARGET"
      - name: Test the native renderer
        env:
          PYTHONUTF8: '1'
          TEXINSITU_KERNEL: ${{ github.workspace }}/kernel/target/${{ matrix.target }}/release/texinsitu${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/renderer.py
      - name: Test and package release executable
        run: python .github/scripts/release.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Confirm the release tag has not moved
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-*
          path: dist
          merge-multiple: true
      - name: Verify the complete release set
        run: python3 .github/scripts/release.py verify
      - name: Upload release assets
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG"
          fi
